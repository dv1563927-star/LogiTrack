spring.application.name=logitrack

# Base de datos MySQL
# createDatabaseIfNotExist: si la base no existe, MySQL la crea al conectar
spring.datasource.url=jdbc:mysql://localhost:3306/logitrack?createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1097911972

# No dejamos que Hibernate cree las tablas: las crea schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Ejecuta schema.sql y data.sql cada vez que arranca la aplicacion
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
