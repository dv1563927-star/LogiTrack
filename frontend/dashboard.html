<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LogiTrack — Panel</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="app">

  <!-- ============ BARRA LATERAL ============ -->
  <aside class="barra">
    <div class="barra__marca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 9.5 12 4l9 5.5v5L12 20l-9-5.5z"/>
        <path d="M3 9.5 12 15l9-5.5M12 15v5"/>
      </svg>
      <span>LogiTrack</span>
    </div>

    <div class="barra__seccion">Inventario</div>
    <nav class="barra__nav">
      <button class="barra__enlace" data-vista="bodegas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/></svg>
        <span>Bodegas</span>
      </button>
      <button class="barra__enlace" data-vista="productos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7 12 3 4 7v10l8 4 8-4z"/><path d="m4 7 8 4 8-4M12 11v10"/></svg>
        <span>Productos</span>
      </button>
      <button class="barra__enlace" data-vista="inventario">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="10" cy="18" r="1.4"/></svg>
        <span>Inventario</span>
      </button>
    </nav>

    <div class="barra__seccion">Operación</div>
    <nav class="barra__nav">
      <button class="barra__enlace" data-vista="movimiento">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
        <span>Movimientos</span>
      </button>
      <button class="barra__enlace" data-vista="detalle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2"/><circle cx="3.5" cy="12" r="1.2"/><circle cx="3.5" cy="18" r="1.2"/></svg>
        <span>Detalle</span>
      </button>
    </nav>

    <div class="barra__seccion solo-admin">Administración</div>
    <nav class="barra__nav solo-admin">
      <button class="barra__enlace" data-vista="solicitudes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
        <span>Solicitudes</span>
      </button>
      <button class="barra__enlace" data-vista="auditoria">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 4.4-3.4 8.3-8 9-4.6-.7-8-4.6-8-9V7z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Auditoría</span>
      </button>
      <button class="barra__enlace" data-vista="reporte">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Reporte</span>
      </button>
    </nav>

    <div class="barra__pie">
      <div class="barra__usuario">
        <span class="barra__inicial" id="inicial">?</span>
        <div>
          <span id="usuario-nombre">—</span>
          <span class="barra__rol" id="usuario-rol">—</span>
        </div>
      </div>
      <button class="barra__salir" id="btn-salir">Cerrar sesión</button>
    </div>
  </aside>

  <!-- ============ CONTENIDO ============ -->
  <div class="contenido">
    <header class="cabecera">
      <div class="cabecera__texto">
        <h1 id="titulo-vista">Bodegas</h1>
        <p id="desc-vista">Cargando…</p>
      </div>
    </header>

    <section class="vista" id="vista">
      <div class="panel"><div class="panel__cabecera"><div><h3>Cargando</h3><p>Un momento…</p></div></div></div>
    </section>
  </div>

</div>

<script src="js/dashboard.js"></script>
</body>
</html>
